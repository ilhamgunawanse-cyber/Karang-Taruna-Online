name: Build Karang Taruna Online APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter
        run: flutter --version

      - name: Extract source
        run: |
          rm -rf project
          mkdir project
          unzip -q Karang_Taruna_Online_v1_1_Firebase_Source.zip -d project

      - name: Generate Android project
        working-directory: project
        run: |
          rm -rf android
          flutter create . --platforms android --project-name karang_taruna_online

      - name: Install dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karang-taruna-online-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
